name: ASMR pipeline regression

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: chmod +x Web-UI/bin/* scripts/*.sh
      - run: ./scripts/test.sh
