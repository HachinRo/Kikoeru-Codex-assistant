  <style>
    #asmr-index-refresh {
      width: 100%;
      min-height: 48px;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font: inherit;
      text-align: left;
    }
    #asmr-index-refresh[disabled] {
      opacity: .65;
      cursor: wait;
    }
    #asmr-library-dashboard-link {
      width: 100%;
      min-height: 48px;
      color: inherit;
      cursor: pointer;
      text-decoration: none;
    }
    .asmr-sidebar-action {
      box-sizing: border-box;
    }
    .asmr-sidebar-action .q-item__section--avatar {
      min-width: 56px;
    }
    .asmr-sidebar-separator {
      height: 1px;
      margin: 8px 0;
      background: rgba(0,0,0,.12);
    }
    #asmr-work-refresh,
    #asmr-work-delete {
      display: inline-flex;
      width: 30px;
      height: 30px;
      margin-left: 8px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      transition: background-color .15s ease;
    }
    #asmr-work-refresh {
      color: #1976d2;
    }
    #asmr-work-delete {
      color: #c10015;
    }
    #asmr-work-refresh:hover,
    #asmr-work-refresh:focus-visible {
      background: rgba(25,118,210,.1);
      outline: none;
    }
    #asmr-work-delete:hover,
    #asmr-work-delete:focus-visible {
      background: rgba(193,0,21,.1);
      outline: none;
    }
    #asmr-work-refresh .material-icons,
    #asmr-work-delete .material-icons {
      font-size: 18px;
    }
    #asmr-work-refresh[aria-busy="true"] .material-icons {
      animation: asmr-refresh-spin .8s linear infinite;
    }
    @keyframes asmr-refresh-spin {
      to { transform: rotate(360deg); }
    }
    #asmr-work-refresh[disabled],
    #asmr-work-delete[disabled] {
      opacity: .65;
      cursor: wait;
    }
    .asmr-delete-overlay {
      position: fixed;
      inset: 0;
      z-index: 100000;
      background: rgba(0,0,0,.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .asmr-delete-dialog {
      width: min(440px, 100%);
      border-radius: 4px;
      background: #fff;
      color: rgba(0,0,0,.87);
      box-shadow: 0 8px 24px rgba(0,0,0,.35);
      padding: 22px;
      font-family: Roboto, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif;
    }
    .asmr-delete-dialog h2 {
      margin: 0 0 12px;
      font-size: 21px;
      font-weight: 500;
    }
    .asmr-delete-dialog p {
      margin: 0 0 12px;
      line-height: 1.45;
    }
    .asmr-delete-title {
      font-weight: 500;
    }
    .asmr-delete-dialog input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #bdbdbd;
      border-radius: 4px;
      padding: 10px 12px;
      font: inherit;
    }
    .asmr-delete-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }
    .asmr-delete-actions button {
      border: 0;
      border-radius: 3px;
      padding: 8px 14px;
      font: inherit;
      font-weight: 500;
      cursor: pointer;
    }
    .asmr-delete-cancel {
      background: transparent;
      color: #1976d2;
    }
    .asmr-delete-confirm {
      background: #c10015;
      color: #fff;
    }
    .asmr-delete-confirm[disabled] {
      opacity: .5;
      cursor: not-allowed;
    }
    .asmr-work-cover-panel {
      display: block;
      width: min(280px, calc(100vw - 32px));
      margin: 16px 16px 8px;
      border-radius: 4px;
      overflow: hidden;
      background: rgba(0,0,0,.08);
      box-shadow: 0 2px 8px rgba(0,0,0,.22);
    }
    .asmr-work-cover-panel img {
      display: block;
      width: 100%;
      height: auto;
    }
    .q-drawer a[href="/admin"],
    .q-drawer .q-item[href="/admin"] {
      display: none !important;
    }
  </style></head>
  <body>
    <noscript>
      We are sorry, but Kikoeru requires Javascript to work.
    </noscript>
    <!-- DO NOT touch the following DIV -->
    <div id="q-app"></div>
    <button id="asmr-index-refresh" title="刷新媒体库" aria-label="刷新媒体库"></button>
    <a id="asmr-library-dashboard-link" title="管理面板" aria-label="管理面板" href="/asmr-library"></a>
    <script>
      (function () {
        if (window.location.pathname.replace(/\/$/, '') === '/favourites/folder') {
          window.history.replaceState(null, '', '/favourites')
        }
        var btn = document.getElementById('asmr-index-refresh')
        if (!btn) return
        var dashboard = document.getElementById('asmr-library-dashboard-link')
        function sidebarActionContent (icon, label) {
          return '<div tabindex="-1" class="q-focus-helper"></div>' +
            '<div class="q-item__section column q-item__section--avatar q-item__section--side justify-center">' +
              '<i aria-hidden="true" role="presentation" class="q-icon notranslate material-icons">' + icon + '</i>' +
            '</div>' +
            '<div class="q-item__section column q-item__section--main justify-center">' +
              '<div class="q-item__label text-subtitle1">' + label + '</div>' +
            '</div>'
        }
        function installSidebarActions () {
          var list = document.querySelector('.q-drawer .q-list')
          if (!list || btn.parentNode === list) return
          var separator = document.getElementById('asmr-sidebar-separator')
          if (!separator) {
            separator = document.createElement('div')
            separator.id = 'asmr-sidebar-separator'
            separator.className = 'asmr-sidebar-separator'
            list.appendChild(separator)
          }
          btn.className = 'asmr-sidebar-action q-item q-item-type row no-wrap q-item--clickable q-link cursor-pointer q-focusable q-hoverable'
          btn.setAttribute('role', 'listitem')
          btn.innerHTML = sidebarActionContent('refresh', '刷新媒体库')
          list.appendChild(btn)
          if (dashboard) {
            dashboard.className = 'asmr-sidebar-action q-item q-item-type row no-wrap q-item--clickable q-link cursor-pointer q-focusable q-hoverable'
            dashboard.setAttribute('role', 'listitem')
            dashboard.innerHTML = sidebarActionContent('dashboard', '管理面板')
            list.appendChild(dashboard)
          }
        }
        new MutationObserver(installSidebarActions).observe(document.body, { childList: true, subtree: true })
        window.addEventListener('load', installSidebarActions)
        installSidebarActions()
        function jsonFetch (path, opts) {
          return fetch(path, opts).then(function (r) {
            return r.json().then(function (j) {
              if (!r.ok) throw new Error(j.error || r.statusText)
              return j
            })
          })
        }
        function waitAction (id) {
          return new Promise(function (resolve, reject) {
            function poll () {
              jsonFetch('/api/asmr-library/actions/' + encodeURIComponent(id))
                .then(function (action) {
                  if (action.status === 'running') return setTimeout(poll, 1200)
                  if (action.status === 'done') return resolve(action)
                  reject(new Error(action.error || action.output || 'Action failed'))
                })
                .catch(reject)
            }
            poll()
          })
        }
 function dashboardAuthHeader () {
 try { return window.sessionStorage.getItem('asmrAdminBasicAuth') || '' } catch (err) { return '' }
 }
 function runIndexRefresh () {
 var auth = dashboardAuthHeader()
 if (!auth) return Promise.reject(new Error('admin credentials required'))
 return jsonFetch('/api/asmr-library/actions/reindex', {
 method: 'POST',
 headers: {'Content-Type': 'application/json', 'Authorization': auth, 'X-ASMR-Dashboard-Request': '1'},
 body: JSON.stringify({})
 }).then(function (action) {
 return waitAction(action.id)
 }).then(function () {
 return jsonFetch('/api/admin/refresh-cache', {
 method: 'POST',
 headers: {'Content-Type': 'application/json', 'Authorization': auth, 'X-ASMR-Dashboard-Request': '1'},
 body: JSON.stringify({})
 })
 })
 }
 btn.addEventListener('click', function () {
 var old = btn.innerHTML
 btn.disabled = true
 btn.setAttribute('aria-busy', 'true')
          runIndexRefresh().then(function (res) {
              console.log('ASMR library scan result:', res)
              setTimeout(function () {
                btn.innerHTML = old
                btn.disabled = false
                btn.removeAttribute('aria-busy')
                window.location.reload()
              }, 900)
            })
            .catch(function (err) {
              console.error('ASMR refresh failed:', err)
              if (/admin credentials/i.test(String(err && err.message || err))) {
                window.alert('请先在管理面板保存管理员登录信息，然后再刷新媒体库。')
                window.location.href = '/asmr-library'
                return
              }
              setTimeout(function () { btn.innerHTML = old; btn.disabled = false; btn.removeAttribute('aria-busy') }, 2200)
            })
        })
      }())
    </script>
    <script type="text/javascript" src="/js/asmr-work-delete.js?v=refresh5"></script>
    <script>
      (function () {
        var current = ''
        function workIdFromPath () {
          var m = window.location.pathname.match(/^\/work\/(RJ\d+)/i)
          return m ? m[1].toUpperCase() : ''
        }
        function removeCover () {
          var old = document.getElementById('asmr-work-cover-panel')
          if (old) old.remove()
        }
        function insertCover (id) {
          var root = document.querySelector('.q-page')
          if (!root || document.getElementById('asmr-work-cover-panel')) return
          fetch('/api/work/' + encodeURIComponent(id))
            .then(function (r) { return r.ok ? r.json() : null })
            .then(function (work) {
              if (!work || !work.has_cover) return
              var panel = document.createElement('a')
              panel.id = 'asmr-work-cover-panel'
              panel.className = 'asmr-work-cover-panel'
              panel.href = work.coverUrl || ('/api/covers/' + id)
              panel.target = '_blank'
              panel.rel = 'noopener'
              var img = document.createElement('img')
              img.alt = work.title || id
              img.src = (work.coverUrl || ('/api/covers/' + id)) + '?v=' + Date.now()
              panel.appendChild(img)
              root.insertBefore(panel, root.firstChild)
            })
            .catch(function (err) { console.warn('ASMR work cover insert failed:', err) })
        }
        function syncCover () {
          var id = workIdFromPath()
          if (!id) {
            current = ''
            removeCover()
            return
          }
          if (id === current && document.getElementById('asmr-work-cover-panel')) return
          current = id
          removeCover()
          setTimeout(function () { insertCover(id) }, 250)
          setTimeout(function () { insertCover(id) }, 1200)
        }
        ;['pushState', 'replaceState'].forEach(function (name) {
          var original = history[name]
          history[name] = function () {
            var result = original.apply(this, arguments)
            setTimeout(syncCover, 0)
            return result
          }
        })
        window.addEventListener('popstate', syncCover)
        new MutationObserver(syncCover).observe(document.getElementById('q-app'), { childList: true, subtree: true })
        syncCover()
      }())
    </script>
